<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="560" viewBox="0 0 1050 560" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<rect width="1050" height="560" fill="white"/>
<text x="525" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2430">UC-05 录入销售草稿</text>
<text x="525" y="52" text-anchor="middle" font-size="13" fill="#5b6472">UC-05（基本路径）</text>
<circle cx="62" cy="62" r="11" fill="white" stroke="#1f2430" stroke-width="2"/>
<line x1="62" y1="73" x2="62" y2="102" stroke="#1f2430" stroke-width="2"/>
<line x1="46" y1="84" x2="78" y2="84" stroke="#1f2430" stroke-width="2"/>
<line x1="62" y1="102" x2="49" y2="126" stroke="#1f2430" stroke-width="2"/>
<line x1="62" y1="102" x2="75" y2="126" stroke="#1f2430" stroke-width="2"/>
<text x="62" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2430">销售员</text>
<line x1="62" y1="172" x2="62" y2="520" stroke="#9aa2ad" stroke-width="1.2" stroke-dasharray="5,4"/>
<rect x="220" y="82" width="140" height="34" rx="5" fill="#ffd9e2" stroke="#f472b6" stroke-width="1.5"/>
<text x="290" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f2430">:班次</text>
<line x1="290" y1="118" x2="290" y2="520" stroke="#9aa2ad" stroke-width="1.2" stroke-dasharray="5,4"/>
<rect x="420" y="82" width="140" height="34" rx="5" fill="#ffd9e2" stroke="#f472b6" stroke-width="1.5"/>
<text x="490" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f2430">:销售</text>
<line x1="490" y1="118" x2="490" y2="520" stroke="#9aa2ad" stroke-width="1.2" stroke-dasharray="5,4"/>
<rect x="620" y="82" width="140" height="34" rx="5" fill="#ffd9e2" stroke="#f472b6" stroke-width="1.5"/>
<text x="690" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f2430">:销售项</text>
<line x1="690" y1="118" x2="690" y2="520" stroke="#9aa2ad" stroke-width="1.2" stroke-dasharray="5,4"/>
<rect x="820" y="82" width="140" height="34" rx="5" fill="#d9f2d3" stroke="#3f9d4e" stroke-width="1.5"/>
<text x="890" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f2430">:商品说明</text>
<line x1="890" y1="118" x2="890" y2="520" stroke="#9aa2ad" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="176.0" y="164" text-anchor="middle" font-size="13.5" fill="#1f2430">获取进行中班次()</text>
<line x1="62" y1="172" x2="290" y2="172" stroke="#1f2430" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="276.0" y="200" text-anchor="middle" font-size="13.5" fill="#1f2430">创建草稿(班次)</text>
<line x1="62" y1="208" x2="490" y2="208" stroke="#1f2430" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="276.0" y="256" text-anchor="middle" font-size="13.5" fill="#1f2430">添加销售项(商品,数量,成交价)</text>
<line x1="62" y1="264" x2="490" y2="264" stroke="#1f2430" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="690.0" y="312" text-anchor="middle" font-size="13.5" fill="#1f2430">校验底价(成交价)</text>
<line x1="490" y1="320" x2="890" y2="320" stroke="#1f2430" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="590.0" y="368" text-anchor="middle" font-size="13.5" fill="#1f2430">计算金额()</text>
<line x1="490" y1="376" x2="690" y2="376" stroke="#1f2430" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M490,424 h66 v16 h-58" fill="none" stroke="#1f2430" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="564" y="434" font-size="13.5" fill="#1f2430">保存草稿()</text>
<defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#1f2430"/></marker></defs>
<text x="525" y="546" text-anchor="middle" font-size="12.5" fill="#5b6472">成交价低于底价则拒绝；草稿不扣库存</text>
</svg>