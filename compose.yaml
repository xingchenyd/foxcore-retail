name: foxcore
services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: foxcore-db:1.0.0
    restart: unless-stopped
    environment:
      TZ: UTC
    volumes:
      - db_data:/var/lib/mysql
      - root_secret:/run/foxcore-root
      - app_secret:/run/foxcore-app
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --host=127.0.0.1 --user=root --password=\"$$(cat /run/foxcore-root/password)\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: foxcore-app:1.0.0
    user: "0:0"
    entrypoint: ["node", "scripts/runtime-migrate.mjs"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: foxcore
      DB_USER: foxcore
      DB_ROOT_PASSWORD_FILE: /run/foxcore-root/password
    volumes:
      - root_secret:/run/foxcore-root:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: foxcore-app:1.0.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec", "node scripts/runtime-owner.mjs && exec node apps/server/dist/index.js"]
    environment:
      APP_ENV: local
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: foxcore
      DB_USER: foxcore
      DB_PASSWORD_FILE: /run/foxcore-app/db_password
      OWNER_PASSWORD_FILE: /run/foxcore-app/owner_initial_password
    volumes:
      - app_secret:/run/foxcore-app
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend, frontend]
volumes:
  db_data:
  root_secret:
  app_secret:
networks:
  backend:
    internal: true
  frontend:
